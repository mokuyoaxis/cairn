name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    # ubuntu-latest moved to 26.04 (2026-10-19); setup-python has no 3.9 build
    # there, so pin 3.9 to a runner that still has one.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.9"
            os: ubuntu-22.04
          - python-version: "3.12"
            os: ubuntu-latest

    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Core budget
        run: test "$(wc -l < cairn.py)" -le 1200

      - name: Lint, eval and audit on example fixture
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cp -a examples/. "$tmp"/
          export CAIRN_HOME="$tmp"
          test -n "$(find "$CAIRN_HOME/entries" -maxdepth 1 -name '*.md' -print -quit)"
          python cairn.py lint
          python cairn.py eval
          python cairn.py audit

      - name: Contract admission eval
        run: python eval/contract_eval.py

      - name: Trust & applicability eval
        run: python eval/trust_eval.py

      # Research fixtures are offline: they are not part of the runtime, but they
      # back the published research summary, so they must keep running.
      - name: Research fixtures (offline)
        run: |
          set -euo pipefail
          python eval/schema_check.py eval/taxonomy/entries
          python eval/taxonomy_ab.py > /dev/null
          python eval/taxonomy_phase2.py > /dev/null
          python eval/taxonomy_phase3.py --json > "${RUNNER_TEMP:-/tmp}/phase3.json"
          python - "${RUNNER_TEMP:-/tmp}/phase3.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          assert data["gate_core_mismatch"] == 0, data["gate_core_mismatch"]
          assert len(data["runs"]) == 18, len(data["runs"])
          print("phase3 invariants ok:", len(data["runs"]), "configs")
          PY
          python eval/phase4_chain.py > /dev/null
          python eval/phase4_diagnostic.py

      # Every Python file must stay parseable by the oldest supported interpreter,
      # including research scripts that the unit tests never import.
      - name: AST parses as Python 3.9
        run: |
          python - <<'PY'
          import ast, pathlib
          files = [p for p in sorted(pathlib.Path(".").rglob("*.py"))
                   if ".git" not in p.parts]
          for path in files:
              ast.parse(path.read_text(encoding="utf-8"), feature_version=(3, 9))
          print("AST 3.9 OK:", len(files), "files")
          PY

      # One version string, everywhere. Guards against the drift that a release
      # checklist otherwise catches by hand.
      - name: Version consistency
        run: |
          python - <<'PY'
          import pathlib, re, subprocess, sys
          core = pathlib.Path("cairn.py").read_text(encoding="utf-8")
          version = re.search(r'VERSION = "([^"]+)"', core).group(1)
          exe = sys.executable or "python3"
          cli = subprocess.run([exe, "cairn.py", "--version"],
                               capture_output=True, text=True, check=True).stdout.strip()
          assert cli == "cairn " + version, (cli, version)
          for name, needle in (("README.md", "| Status | `v%s`"),
                               ("README.zh-CN.md", "| 状态 | `v%s`"),
                               ("docs/README.md", "v%s"),
                               ("CHANGELOG.md", "## [%s]")):
              text = pathlib.Path(name).read_text(encoding="utf-8")
              assert (needle % version) in text, (name, needle % version)
          print("version consistent:", version)
          PY

      # Numbers in the docs are claims. Every measured figure must appear, no
      # labelled figure may contradict the measurement, and the eval-set table
      # must equal the fixture line counts. Values are compared numerically so
      # "100%" and "100.0%" are not treated as a contradiction.
      - name: Docs metrics match eval output
        run: |
          python - <<'PY'
          import os, pathlib, re, shutil, subprocess, sys, tempfile

          work = tempfile.mkdtemp()
          home = os.path.join(work, "home")
          shutil.copytree("examples", home)
          env = dict(os.environ, CAIRN_HOME=home, PYTHONDONTWRITEBYTECODE="1")
          out = subprocess.run([sys.executable or "python3", "cairn.py", "eval"],
                               capture_output=True, text=True, env=env, check=True).stdout
          shutil.rmtree(work, ignore_errors=True)

          def grab(pattern):
              match = re.search(pattern, out)
              assert match, "eval output changed shape: %r" % pattern
              return float(match.group(1))

          pos, neg = int(grab(r"正例 (\d+) 条")), int(grab(r"负例 (\d+) 条"))
          truth = {"召回@1": grab(r"召回@1 ([\d.]+)%"),
                   "召回@3": grab(r"召回@3 ([\d.]+)%"),
                   "注入@1": grab(r"注入@1 ([\d.]+)%"),
                   "注入@3": grab(r"注入@3 ([\d.]+)%"),
                   "误触发": grab(r"误触发 ([\d.]+)%")}

          docs = {name: pathlib.Path(name).read_text(encoding="utf-8")
                  for name in ("README.md", "docs/evaluation.md", "docs/development.md")}
          problems = []
          percent = re.compile(r"([\d.]+)%")
          labelled = re.compile(r"(召回@[13]|注入@[13]|误触发)[^\d\n]{0,12}?(?<![≥≤<>])([\d.]+)%")

          for name, text in docs.items():
              mentioned = [float(v) for v in percent.findall(text)]
              for label, value in truth.items():
                  if not any(abs(v - value) < 0.05 for v in mentioned):
                      problems.append("%s: never states %s = %g%% (docs look stale)"
                                      % (name, label, value))
              for match in labelled.finditer(text):
                  label, value = match.group(1), float(match.group(2))
                  if label in truth and abs(value - truth[label]) >= 0.05:
                      problems.append("%s: states %s = %g%% but eval measures %g%%"
                                      % (name, label, value, truth[label]))

          for row, count in (("eval/queries.jsonl", pos), ("eval/negatives.jsonl", neg)):
              line = [l for l in docs["docs/evaluation.md"].splitlines() if row in l]
              if not line or not line[0].rstrip().endswith("| %d |" % count):
                  problems.append("docs/evaluation.md: %s row is not %d" % (row, count))

          for name, count in (("queries.jsonl", pos), ("negatives.jsonl", neg)):
              real = len(pathlib.Path("eval/" + name).read_text(encoding="utf-8").splitlines())
              if real != count:
                  problems.append("eval prints %d for %s but the file holds %d" % (count, name, real))

          if problems:
              for problem in problems:
                  print("::error::" + problem)
              sys.exit(1)
          print("docs metrics ok: %d + %d cases; %s" % (pos, neg,
                ", ".join("%s %g%%" % (k, v) for k, v in sorted(truth.items()))))
          PY
