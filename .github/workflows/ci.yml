name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    # ubuntu-latest moved to 26.04 (2026-10-19); setup-python has no 3.9 build
    # there, so pin 3.9 to a runner that still has one.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.9"
            os: ubuntu-22.04
          - python-version: "3.12"
            os: ubuntu-latest

    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Core budget
        run: test "$(wc -l < cairn.py)" -le 1200

      - name: Lint, eval and audit on example fixture
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cp -a examples/. "$tmp"/
          export CAIRN_HOME="$tmp"
          test -n "$(find "$CAIRN_HOME/entries" -maxdepth 1 -name '*.md' -print -quit)"
          python cairn.py lint
          python cairn.py eval
          python cairn.py audit

      - name: Contract admission eval
        run: python eval/contract_eval.py

      - name: Trust & applicability eval
        run: python eval/trust_eval.py
